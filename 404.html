{% extends "base.html" %}

{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <div class="error-icon">
    <img src="{{ url_for('static', filename='img/favicon-192.png') }}" alt="StudyMate" class="error-favicon" />
  </div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-message">The page you are looking for does not exist or may have been moved. Check the URL and try again.</p>
  <div class="error-actions">
    {% if session.user_id %}
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="btn btn-primary">Go to Login</a>
    {% endif %}
  </div>
</div>
{% endblock %}
